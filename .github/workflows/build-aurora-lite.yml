name: Build Aurora Lite

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: aurora-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # needed to publish the release
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Finds the Aurora Lite project wherever it is: at the repo root, inside a folder,
      # or still inside an uploaded .zip (any file name).
      - name: Find the project
        run: |
          find_project() {
            grep -rl --include='settings.gradle*' 'AuroraLite' "$1" 2>/dev/null | head -n1 || true
          }
          found="$(find_project .)"
          if [ -z "$found" ]; then
            while IFS= read -r z; do
              echo "Trying $z"
              rm -rf aurora-lite-src
              mkdir -p aurora-lite-src
              unzip -oq "$z" -d aurora-lite-src || continue
              found="$(find_project aurora-lite-src)"
              if [ -n "$found" ]; then break; fi
            done < <(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | sort)
          fi
          if [ -z "$found" ]; then
            echo "::error::No Aurora Lite project found. Files in the repo:"
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi
          dir="$(dirname "$found")"
          echo "Using project in: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Build Aurora Lite APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-lite-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Name the APK
        run: cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/AuroraLite.apk"

      # Publishes the APK under the repo's Releases page (not on pull requests)
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lite-build-${{ github.run_number }}
          name: Aurora Lite build ${{ github.run_number }}
          files: AuroraLite.apk
          make_latest: true
